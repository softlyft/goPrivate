services:
  relay:
    build:
      context: .
      dockerfile: apps/relay/Dockerfile
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      HOST: "0.0.0.0"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_RELAY_URL: ws://localhost:3001/ws
    depends_on:
      - relay
    restart: unless-stopped
