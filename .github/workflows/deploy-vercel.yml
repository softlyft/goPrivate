# Deploy goPrivate web to Vercel via CLI (no GitHub org integration required).
# Always run from the monorepo root. Vercel project Root Directory must be `apps/web`.

name: Deploy Web to Vercel

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/web/**'
      - 'packages/protocol/**'
      - 'packages/crypto/**'
      - 'packages/sdk/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - '.github/workflows/deploy-vercel.yml'
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production (remote build from monorepo root)
        id: deploy
        run: |
          url=$(vercel deploy --prod --yes \
            --token="${{ secrets.VERCEL_TOKEN }}" \
            --build-env NEXT_PUBLIC_RELAY_URL="${{ secrets.NEXT_PUBLIC_RELAY_URL }}")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"

      - name: Summary
        run: |
          echo "## Vercel deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **URL:** ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Relay:** \`${{ secrets.NEXT_PUBLIC_RELAY_URL }}\`" >> "$GITHUB_STEP_SUMMARY"
