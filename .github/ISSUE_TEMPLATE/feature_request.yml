name: Feature request
description: Suggest an improvement to reference implementations or tooling
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Protocol-level changes should usually be filed as a **Protocol proposal** and/or an RFC.
